services:
  db:
    image: mysql:8.0
    container_name: traffic_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: traffic_safety
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    container_name: traffic_api
    restart: always
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: traffic_safety
      DB_USER: root
      DB_PASSWORD: rootpassword
    depends_on:
      - db

  dashboard:
    build: .
    container_name: traffic_dashboard
    restart: always
    command: streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000/api
    depends_on:
      - api

volumes:
  db_data: